<!DOCTYPE html>
<html lang="es">

<head>
  <title>Sandwiches</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    @font-face {
      font-family: 'rustic';
      src: url("./fonts/Halftoned Backup.ttf");
      font-display: swap;
    }

    @font-face {
      font-family: 'script';
      src: url("./fonts/DancingScript-Bold.ttf");
      font-display: swap;
    }

    :root {
      --acento: #ff8a2b;
      --texto: #fff;
      --seguro-x: 2.5vw;
      --seguro-y: 3vh;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a0a00;
    }

    #sandwich {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
      color: var(--texto);
    }

    /* ===== ESCENAS: cambio directo; la oculta no se renderiza ===== */
    .escena {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: none;
    }

    .escena.activa {
      display: block;
    }

    .escena-menu.activa {
      display: flex;
      flex-direction: column;
      padding: calc(var(--seguro-y) + 1vh) calc(var(--seguro-x) + 1vw) var(--seguro-y);
    }

    /* ===== FONDO: velo + foto en UNA sola capa =====
       Alfas del velo: .50 / .30 / .55 (sube o baja para ver mas o menos la foto) */
    .fondo {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 0;
      background:
        linear-gradient(180deg,
          rgba(20, 8, 0, .50) 0%,
          rgba(20, 8, 0, .30) 40%,
          rgba(20, 8, 0, .55) 100%),
        url("./fotos/bgsandwichmejor.png") center / cover no-repeat,
        #000;
    }

    /* ===== CABECERA ===== */
    .cabecera {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-bottom: 2.6vh;
    }

    .logo {
      height: 9vh;
      width: auto;
      justify-self: start;
    }

    .titulo {
      font-family: 'rustic', 'Segoe UI', sans-serif;
      font-weight: 400;
      font-size: clamp(32px, 7vh, 110px);
      letter-spacing: .35em;
      padding-left: .35em;
      text-shadow: 0 2px 4px rgba(0, 0, 0, .7);
    }

    .titulo::after {
      content: "";
      display: block;
      height: .6vh;
      margin: .8vh auto 0;
      width: 40%;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, var(--acento), transparent);
    }

    /* ===== LISTA DE TARJETAS ===== */
    .lista {
      position: relative;
      z-index: 2;
      flex: 1;
      min-height: 0;
      display: grid;
      align-content: center;
      grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
      grid-template-rows: repeat(var(--rows, 2), minmax(0, 1fr));
      gap: 3.4vh 2.2vw;
      padding-top: 2.5vh;
    }

    .tarjeta {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 34vw;
      height: 100%;
      max-height: 42vh;
      min-height: 0;
      justify-self: center;
      align-self: center;
      padding: 2.4vh 1.2vw 1.6vh;
      border-radius: 2.4vh;
      background: rgba(25, 10, 2, .78);   /* mas opaco para compensar sin blur */
      border: 1px solid rgba(255, 255, 255, .14);
      border-bottom: .7vh solid var(--acento);
    }

    .foto {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    /* Halo naranja detras de la foto (estatico, barato) */
    .foto::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(75%, 30vh);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 138, 43, .45), transparent 70%);
    }

    .foto img {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .nombre {
      text-align: center;
      line-height: 1.05;
      margin-top: 1vh;
    }

    .n1 {
      display: block;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .05em;
      font-size: clamp(18px, min(4.4vh, 2.4vw), 72px);
      color: var(--acento);
      text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
    }

    .n2 {
      display: block;
      margin-top: .2vh;
      font-family: 'script', 'Segoe Script', 'Brush Script MT', cursive;
      font-size: clamp(18px, min(4.6vh, 2.5vw), 76px);
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
    }

    /* ===== ETIQUETA DE PRECIO (sin sombras) ===== */
    .precio {
      position: absolute;
      top: -2vh;
      right: -.8vw;
      z-index: 3;
      display: flex;
      align-items: flex-start;
      gap: .12em;
      padding: .05em .45em .12em;
      border-radius: 2vh;
      transform: rotate(3deg);
      font-weight: 900;
      line-height: 1;
      color: #2a1000;
      font-size: clamp(24px, min(6.6vh, 3.5vw), 104px);
      background: linear-gradient(135deg, #ffc247, #ff8a2b 60%, #eb6123);
    }

    .precio .ref {
      font-size: .36em;
      margin-top: .5em;
      letter-spacing: .02em;
    }

    .precio .dec {
      font-size: .46em;
      margin-top: .18em;
    }

    /* ===== PUBLICIDAD (una sola capa, cambio directo) ===== */
    .escena-publi {
      background: #000;
    }

    .capa {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: #000 center / contain no-repeat;
    }
  </style>
</head>

<body>
  <main id="sandwich">

    <!-- ESCENA 1: LISTA -->
    <section class="escena escena-menu activa" id="escenaMenu">
      <div class="fondo" aria-hidden="true"></div>

      <header class="cabecera">
        <img class="logo" src="./logo.png" alt="" decoding="async" onerror="this.style.display='none'" />
        <h1 class="titulo">SANDWICHES</h1>
        <span></span>
      </header>

      <div class="lista" id="lista"></div>
    </section>

    <!-- ESCENA 2: PUBLICIDAD -->
    <section class="escena escena-publi" id="escenaPubli" aria-hidden="true">
      <div class="capa" id="capa"></div>
    </section>

  </main>

  <script>
    (() => {
      'use strict';

      /* ============ CONFIGURACIÓN ============ */
      const CONFIG = {
        json: './lib/sandwiches.json',
        porPagina: 6,         // máximo por pantalla (3 x 2)
        menuMs: 35000,        // tiempo que se muestra la lista
        publiMs: 35000,       // tiempo que se muestra cada publicidad
        publiPorTurno: 3,     // publicidades seguidas antes de volver a la lista
      };

      const PUBLI_ANTES = [
        './publicidad/4ESTACIONES.webp',
        './publicidad/CLUBHOUSE.webp',
        './publicidad/ROLLTEMPURA.webp',
        './publicidad/CARNE.webp',
        './publicidad/FILADELFIAROLL.webp',
        './publicidad/POLLO.webp',
        './publicidad/CRISPY.webp',
        './publicidad/MIXTA.webp',
        './publicidad/CACHAPAS.webp',
        './publicidad/WAFFLE.webp',
        './publicidad/PAPASFRITAS.webp',
      ];
      const PERROS = './publicidad/perros.webp';
      const PUBLI_DESPUES = [
        './publicidad/CASHEA1.webp',
        './publicidad/CASHEA2.webp',
      ];

      function listaPublicidad() {
        const l = [...PUBLI_ANTES];
        if (new Date().getHours() >= 15) l.push(PERROS);
        l.push(...PUBLI_DESPUES);
        return l;
      }

      /* ============ ELEMENTOS ============ */
      const escenaMenu = document.getElementById('escenaMenu');
      const escenaPubli = document.getElementById('escenaPubli');
      const lista = document.getElementById('lista');
      const capa = document.getElementById('capa');

      let productos = [];
      let indicePubli = 0;

      const esperar = (ms) => new Promise((r) => setTimeout(r, ms));

      /* ============ DATOS (compatible con HTTP y TV local) ============ */
      function leerJSON(url) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('GET', url + '?t=' + Date.now(), true);
          xhr.timeout = 8000;
          xhr.onload = () => {
            if (xhr.status === 200 || (xhr.status === 0 && xhr.responseText)) {
              try {
                resolve(JSON.parse(xhr.responseText));
              } catch (e) {
                reject(e);
              }
            } else {
              reject(new Error('HTTP ' + xhr.status));
            }
          };
          xhr.onerror = () => reject(new Error('Error de red al leer JSON'));
          xhr.ontimeout = () => reject(new Error('Timeout al leer JSON'));
          xhr.send();
        });
      }

      async function cargarProductos() {
        try {
          const json = await leerJSON(CONFIG.json);
          const l = json && json.data && json.data.sandwiches;
          if (Array.isArray(l) && l.length) productos = l;
        } catch (err) {
          console.warn('No se pudo actualizar sandwiches.json:', err.message);
        }
      }

      /* ============ RENDER ============ */
      function crearPrecio(valor) {
        const el = document.createElement('div');
        el.className = 'precio';
        const t = String(valor != null ? valor : '').trim();
        const m = t.match(/(\d+)(?:[.,](\d+))?/);

        const ref = document.createElement('span');
        ref.className = 'ref';
        ref.textContent = 'Ref';
        el.appendChild(ref);

        const ent = document.createElement('span');
        ent.className = 'ent';
        ent.textContent = m ? m[1] : t;
        el.appendChild(ent);

        if (m && m[2]) {
          const dec = document.createElement('span');
          dec.className = 'dec';
          dec.textContent = ',' + m[2].padEnd(2, '0').slice(0, 2);
          el.appendChild(dec);
        }
        return el;
      }

      function crearTarjeta(p) {
        const tarjeta = document.createElement('article');
        tarjeta.className = 'tarjeta';

        const foto = document.createElement('div');
        foto.className = 'foto';
        if (p.imagen) {
          const img = document.createElement('img');
          img.src = p.imagen;
          img.alt = '';
          img.decoding = 'async';
          img.onerror = () => img.remove();
          foto.appendChild(img);
        }

        const txt = String(p.descripcion || '').trim();
        const k = txt.search(/\s/);
        const primera = k < 0 ? txt : txt.slice(0, k);
        const segunda = k < 0 ? '' : txt.slice(k + 1).trim();

        const nombre = document.createElement('div');
        nombre.className = 'nombre';
        const n1 = document.createElement('span');
        n1.className = 'n1';
        n1.textContent = primera;
        nombre.appendChild(n1);
        if (segunda) {
          const n2 = document.createElement('span');
          n2.className = 'n2';
          n2.textContent = segunda;
          nombre.appendChild(n2);
        }

        tarjeta.append(foto, nombre, crearPrecio(p.precio));
        return tarjeta;
      }

      function productosPorPagina() {
        const paginas = Math.ceil(productos.length / CONFIG.porPagina);
        return Math.ceil(productos.length / paginas);
      }

      function pintarPagina(pagina) {
        const porPag = productosPorPagina();
        const items = productos.slice(pagina * porPag, (pagina + 1) * porPag);
        const cols = items.length === 4 ? 2 : Math.min(items.length, 3);
        const filas = Math.ceil(items.length / cols);
        lista.style.setProperty('--cols', cols);
        lista.style.setProperty('--rows', filas);

        const frag = document.createDocumentFragment();
        items.forEach((p) => frag.appendChild(crearTarjeta(p)));
        lista.replaceChildren(frag);
      }

      /* ============ PRECARGA (solo la siguiente, no todas) ============ */
      function precargar(src) {
        return new Promise((resolve) => {
          const im = new Image();
          im.decoding = 'async';
          const timer = setTimeout(() => resolve(false), 6000);
          im.onload = () => { clearTimeout(timer); resolve(true); };
          im.onerror = () => { clearTimeout(timer); resolve(false); };
          im.src = src;
        });
      }

      /* ============ ESCENAS ============ */
      function mostrarMenu() {
        window.scrollTo(0, 0);
        escenaPubli.classList.remove('activa');
        escenaPubli.setAttribute('aria-hidden', 'true');
        escenaMenu.classList.add('activa');
        escenaMenu.removeAttribute('aria-hidden');
        capa.style.backgroundImage = '';   // libera la imagen de publicidad
      }

      async function mostrarPubli() {
        window.scrollTo(0, 0);
        const l = listaPublicidad();

        let src = null;
        for (let intento = 0; intento < l.length; intento++) {
          const candidata = l[indicePubli % l.length];
          indicePubli = (indicePubli + 1) % l.length;
          if (await precargar(candidata)) {
            src = candidata;
            break;
          }
          console.warn('No se pudo cargar la imagen:', candidata);
        }
        if (!src) return false;

        capa.style.backgroundImage = `url('${src}')`;
        escenaMenu.classList.remove('activa');
        escenaMenu.setAttribute('aria-hidden', 'true');
        escenaPubli.classList.add('activa');
        escenaPubli.removeAttribute('aria-hidden');

        // deja lista la siguiente mientras esta se muestra
        const l2 = listaPublicidad();
        precargar(l2[indicePubli % l2.length]);
        return true;
      }

      /* ============ CICLO PRINCIPAL ============ */
      async function ciclo() {
        let pagina = 0;

        while (true) {
          try {
            await cargarProductos();

            if (!productos.length) {
              await esperar(5000);
              continue;
            }

            const paginas = Math.ceil(productos.length / CONFIG.porPagina);
            if (pagina >= paginas) pagina = 0;

            // 1) Sandwiches
            pintarPagina(pagina);
            mostrarMenu();
            await esperar(CONFIG.menuMs);
            pagina = (pagina + 1) % paginas;

            // 2) Publicidad(es)
            for (let k = 0; k < CONFIG.publiPorTurno; k++) {
              const ok = await mostrarPubli();
              if (ok) await esperar(CONFIG.publiMs);
            }
          } catch (err) {
            console.error('Error en ciclo:', err);
            await esperar(3000);
          }
        }
      }

      ciclo();
    })();
  </script>

  <!-- Mural sincronizado: TV 3 de 4 -->
  <script src="./mural-sync.js" data-col="2" data-fila="0"></script>
</body>

</html>
