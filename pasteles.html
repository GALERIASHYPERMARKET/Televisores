<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Galeria Hypermarket</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="./styles/stylesHojaldre.css">
    <script type="text/javascript" src="script.js"></script>
  </head>
  <body onload="cargarData()" style="background-color: black;">
      
    <main id="pasteles" class="pasteles" style="position: relative; overflow: hidden;"> 

      <div class="header">
        <h1 class="titulos" style="color:white">GALERIA HYPERMARKET</h1>
        <div class="titulos" style="color:white">Sopas</div>
      </div>
      <section class="listas">
        <iframe src="/prueba2.html" id="frameHojaldre" title="W3Schools Free Online Web Tutorials"></iframe>
        <div class="listaProductos"></div>
      </section>
    </main>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    var contador = 4;
    var contadorPublicidad = 1;
    var cpublicidad = 1;

    const timeline = gsap.timeline({ duration: 1, paused: false });

    function loadAnimation() {
      timeline.to(".listaProductos .producto", {
        duration: 8,
        opacity: 1,
        stagger: 0.3
      });
      timeline.play();
    }

    function backgroundAnimation() {
      gsap.fromTo(
        ".pasteles",
        { opacity: 0, x: -1000 },
        { opacity: 1, x: 0, duration: 2, ease: "power2.out" }
      );
    }

    function removeBackgroundAnimation() {
      gsap.fromTo(
        ".pasteles",
        { opacity: 1, x: 0 },
        { opacity: 0, x: 2000, duration: 2, ease: "power2.out" }
      );
    }

    function cargarData() {
      fetch('./lib/pasteles.json').then(function(response) {
        let text = "";
        document.getElementById("pasteles").style.backgroundImage = "url('./otono/PASTELES.webp')";
        backgroundAnimation();
        if (response.ok) {
          response.json().then(function(response) {
            let data = response.data.pasteles.slice(0, 5);
            for (const productos of data) {
              let text2 = "<div class='producto'><div class='nombreProducto'>" + productos.descripcion + "</div><div class='precioProducto'>" + productos.precio + "</div></div>";
              text += text2;
            }
            document.querySelector(".listaProductos").innerHTML = text;
            loadAnimation();
          });
        }
      });
    }

    // ===== LISTA DE PUBLICIDADES =====
    // Para agregar una foto nueva, solo añade una línea aquí
    // (la imagen debe estar en ./publicidad/).
    const PUBLICIDADES = [
      'PIZZA.webp',
      'POSTRE.png',
      '4ESTACIONES.gif',     // GIF animado: se le añade ?t= para que la animación reinicie
      'MARGARITA.webp',
      'VEGETARIANA.webp',
      'PEPPERONI.webp',
      'PRIMAVERA.webp'
    ];

    // ===== PROMOCIÓN SUSHIS =====
    // Se intercalan entre las demás publicidades, rotando entre los tres.
    const SUSHIS = [
      'ROLLTEMPURA.webp',
      'FILADELFIAROLL.webp',
      'CALIFORNIAROLL.webp',
      'WAFFLE.webp',
    ];
    // Cuántas fotos de sushi salen después de CADA publicidad normal.
    // 1 = la mitad de las fotos son sushi, 2 = dos de cada tres, 3 = tres de cada cuatro.
    const SUSHIS_POR_PUBLI = 2;

    // Lista final: publicidad, sushi, sushi, publicidad, sushi, sushi...
    const SECUENCIA = [];
    (function armarSecuencia() {
      let s = 0;
      PUBLICIDADES.forEach(function(p) {
        SECUENCIA.push(p);
        for (let k = 0; k < SUSHIS_POR_PUBLI; k++) {
          SECUENCIA.push(SUSHIS[s % SUSHIS.length]);
          s++;
        }
      });
    })();

    // Precarga: todas las imágenes se descargan al arrancar para que no
    // aparezca el fondo en blanco al cambiar de foto.
    (function precargarImagenes() {
      const todas = PUBLICIDADES.concat(SUSHIS);
      todas.forEach(function(img) {
        if (img.indexOf('.gif') === -1) {   // el GIF lleva ?t= y se carga al mostrarse
          new Image().src = './publicidad/' + img;
        }
      });
      new Image().src = './otono/PASTELES.webp';
    })();

    function cargarPublicidad() {
      const pasteles = document.getElementById("pasteles");
      let img = SECUENCIA[cpublicidad - 1];
      let url = "./publicidad/" + img;
      if (img.indexOf('.gif') !== -1) {
        url += "?t=" + Date.now();
      }
      pasteles.style.backgroundImage = "url('" + url + "')";
      // avanza al siguiente; al llegar al final vuelve a 1
      cpublicidad = (cpublicidad % SECUENCIA.length) + 1;
      contadorPublicidad++;
    }

    setInterval(function() {
      let text = "";
      
      if (contadorPublicidad % 2 == 0) {
        cargarPublicidad();
        backgroundAnimation();
        document.querySelector(".listaProductos").innerHTML = text;
      } else {
        fetch('./lib/pasteles.json').then(function(response) {
          if (response.ok) {
            document.getElementById("pasteles").style.backgroundImage = "url('./otono/PASTELES.webp')";
            backgroundAnimation();
            response.json().then(function(response) {
              document.querySelector(".listaProductos").innerHTML = "";
              let data = response.data.pasteles.slice(contador, contador + 5);
              
              for (const productos of data) {
                let text2 = "<div class='producto'><div class='nombreProducto'>" + productos.descripcion + "</div><div class='precioProducto'>" + productos.precio + "</div></div>";
                text += text2;
              }
              document.querySelector(".listaProductos").innerHTML = text;
              loadAnimation();
              if (contador >= response.data.pasteles.length - 5) {
                contador = 0;
              } else {
                contador = contador + 4;
              }
            });
            contadorPublicidad++;
          }
        });
      }
    }, 30000);
  </script>
</html>
