<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Other page</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="./styles/stylesHojaldre.css">
    <script type="text/javascript" src="script.js"></script>
  </head>
  <body onload="cargarData()" style="background-color: black;">
      
    <main id="pasteles" class="pasteles" style="position: relative; overflow: hidden;"> 
      <!-- Video de fondo para animaciones -->
      <video id="videoBg" autoplay loop muted playsinline style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;"></video>

      <div class="header">
        <h1 class="titulos" style="color:white">GALERIA HYPERMARKET</h1>
        <div class="titulos" style="color:white">Sopas</div>
      </div>
      <section class="listas">
        <iframe src="/prueba2.html" id="frameHojaldre" title="W3Schools Free Online Web Tutorials">
        </iframe>
        
        <div class="listaProductos">
          
        </div>
      </section>
    </main>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    var contador = 4;
    var contadorPublicidad = 1;
    var cpublicidad = 1;
    var contadorVideo = 1;
    var contadorHojaldre = 1;

    const timeline = gsap.timeline({
      duration: 1,
      paused: false
    });

    function loadAnimation() {
      timeline.to(".listaProductos .producto", {
        duration: 8,
        opacity: 1,
        stagger: 0.3
      });
      timeline.play();
    }

    function backgroundAnimation() {
      gsap.fromTo(
        ".pasteles",
        { opacity: 0, x: -1000 },
        { opacity: 1, x: 0, duration: 2, ease: "power2.out" }
      );
    }

    function removeBackgroundAnimation() {
      gsap.fromTo(
        ".pasteles",
        { opacity: 1, x: 0 },
        { opacity: 0, x: 2000, duration: 2, ease: "power2.out" }
      );
    }

    // Funciones auxiliares para controlar el video de fondo
    function ocultarVideoFondo() {
      const video = document.getElementById("videoBg");
      if (video) {
        video.pause();
        video.style.display = "none";
      }
    }

    function mostrarVideoFondo(src) {
      const pasteles = document.getElementById("pasteles");
      const video = document.getElementById("videoBg");
      if (video) {
        pasteles.style.backgroundImage = "none";
        video.src = src;
        video.style.display = "block";
        video.play();
      }
    }

    function cargarData() {
      ocultarVideoFondo();
      fetch('./lib/pasteles.json').then(function(response) {
        let text = "";
        document.getElementById("pasteles").style.backgroundImage = "url('./otono/PASTELES.webp')";
        backgroundAnimation();
        if (response.ok) {
          response.json().then(function(response) {
            let data = response.data.pasteles.slice(0, 5);
            for (const productos of data) {
              let text2 = "<div class='producto'><div class='nombreProducto'>" + productos.descripcion + "</div><div class='precioProducto'>" + productos.precio + "</div></div>";
              text += text2;
            }
            document.querySelector(".listaProductos").innerHTML = text;
            loadAnimation();
          });
        } else {
          console.log('Respuesta de red OK pero respuesta HTTP no OK');
        }
      })
      .catch(function(error) {
        console.log('Hubo un problema con la petición Fetch:' + error.message);
      });
    }

    function cargarPublicidad() {
      const pasteles = document.getElementById("pasteles");

      if (cpublicidad == 1) {
        ocultarVideoFondo();
        pasteles.style.backgroundImage = "url('./publicidad/PIZZA.webp')";
        cpublicidad++;
      } else if (cpublicidad == 2) {
        ocultarVideoFondo();
        pasteles.style.backgroundImage = "url('./publicidad/POSTRE.png')";
        cpublicidad++;
      } else if (cpublicidad == 3) {
        // Muestra el video de 4 estaciones
        mostrarVideoFondo('./publicidad/4ESTACIONES.mp4');
        cpublicidad++;
      } else if (cpublicidad == 4) {
        ocultarVideoFondo();
        pasteles.style.backgroundImage = "url('./publicidad/MARGARITA.webp')";
        cpublicidad++;
      } else if (cpublicidad == 5) {
        ocultarVideoFondo();
        pasteles.style.backgroundImage = "url('./publicidad/VEGETARIANA.webp')";
        cpublicidad++;
      } else if (cpublicidad == 6) {
        ocultarVideoFondo();
        pasteles.style.backgroundImage = "url('./publicidad/PEPPERONI.webp')";
        cpublicidad++;
      } else if (cpublicidad == 7) {
        ocultarVideoFondo();
        pasteles.style.backgroundImage = "url('./publicidad/PRIMAVERA.webp')";
        cpublicidad = cpublicidad - 6;
      }
      contadorPublicidad++;
    }

    setInterval(function() {
      let text = "";
      
      if (contadorPublicidad % 2 == 0) {
        cargarPublicidad();
        backgroundAnimation();
        document.querySelector(".listaProductos").innerHTML = text;
      } else {
        ocultarVideoFondo();

        fetch('./lib/pasteles.json').then(function(response) {
          if (response.ok) {
            document.getElementById("pasteles").style.backgroundImage = "url('./otono/PASTELES.webp')";
            backgroundAnimation();
            response.json().then(function(response) {
              document.querySelector(".listaProductos").innerHTML = "";
              let data = response.data.pasteles.slice(contador, contador + 5);
              
              for (const productos of data) {
                let text2 = "<div class='producto'><div class='nombreProducto'>" + productos.descripcion + "</div><div class='precioProducto'>" + productos.precio + "</div></div>";
                text += text2;
              }
              document.querySelector(".listaProductos").innerHTML = text;
              loadAnimation();
              if (contador >= response.data.pasteles.length - 5) {
                contador = 0;
              } else {
                contador = contador + 4;
              }
            });
            contadorPublicidad++;
          } else {
            console.log('Respuesta de red OK pero respuesta HTTP no OK');
          }
        })
        .catch(function(error) {
          console.log('Hubo un problema con la petición Fetch:' + error.message);
        });
      }
    }, 30000);
  </script>
</html>
