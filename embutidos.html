<!DOCTYPE html>
<html lang="es">
<head>
  <title>Other page</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="embutidos.css" />
  <script type="text/javascript" src="script.js"></script>
</head>
<body id="embutidos" onload="cargarData()">

  <main>
    <div class="container"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    var contador = 0;
    var contadorPublicidad = 1;
    var cpublicidad = 1;

    // Se crea una animación limpia en cada ciclo
    function loadAnimation() {
      gsap.fromTo(
        ".product",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 1, stagger: 0.2 }
      );
    }

    function reducirTamano() {
      for (const a of document.querySelectorAll(".linea")) {
        var text = a.textContent;
        var length = 18;
        var trimmedString = text.length > length ? text.substring(0, 18) + "..." : text;
        a.textContent = trimmedString;
      }
    }

    function oferta(oferta) {
      if (oferta === "si") {
        return `<div class="containerOferta">
                  <img class="oferta" src="./etiquetaOferta.png" alt="Oferta">
                </div>`;
      }
      return "";
    }

    function cargarPublicidad() {
      const publicidades = [
        "url('./publicidad/HELADOS.webp')",
        "url('./publicidad/affocato.png')",
        "url('./publicidad/POSTRE.png')",
        "url('./publicidad/ALGODON_AZUCAR.jpg')",
        "url('./publicidad/COTUFAS.png')",
        "url('./publicidad/HIELO2.png')",
        "url('./publicidad/HIELO 6KG.png')"
      ];

      document.getElementById("embutidos").style.backgroundImage = publicidades[cpublicidad - 1];
      cpublicidad = (cpublicidad % publicidades.length) + 1;
      contadorPublicidad++;
    }

    function generarHTMLProductos(data) {
      return data.map(productos => `
        <div class="product">
          ${oferta(productos.oferta)}
          <div class="descriptions">
            <p class="name">${productos.descripcion}</p>
            <section class="subdescription">
              <div class="cuantity_background" style="margin-bottom: 10px;">
                <p class="CUANTITY">${productos.peso}</p>
              </div>
              <p class="price">${productos.precio}</p>
            </section>
          </div>
          <div class="image">
            <img src="${productos.imagen}" alt="${productos.descripcion}">
          </div>
        </div>
      `).join('');
    }

    function cargarData() {
      fetch('./lib/embutidos.json')
        .then(response => response.json())
        .then(response => {
          let data = response.data.embutidos.slice(0, 6);
          document.querySelector(".container").innerHTML = generarHTMLProductos(data);
          loadAnimation();
        })
        .catch(error => console.log('Error Fetch:', error.message));
    }

    setInterval(function() {
      if (contadorPublicidad % 2 === 0) {
        cargarPublicidad();
        document.querySelector(".container").innerHTML = "";
      } else {
        fetch('./lib/embutidos.json')
          .then(response => response.json())
          .then(response => {
            document.getElementById("embutidos").style.backgroundImage = "url('./otono/JAMON.png')";
            
            let total = response.data.embutidos.length;
            let data = response.data.embutidos.slice(contador, contador + 6);
            
            document.querySelector(".container").innerHTML = generarHTMLProductos(data);
            loadAnimation();

            contador += 4;
            if (contador >= total) {
              contador = 0;
            }
            contadorPublicidad++;
          })
          .catch(error => console.log('Error Fetch:', error.message));
      }
    }, 35000);
  </script>
</body>
</html>
