<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Pastas</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet" />
    <script type="text/javascript" src="script.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      #gourmet {
        position: relative;
        width: 100vw;
        height: 100vh;
        background-color: #000;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        font-family: 'Montserrat', 'Arial Black', Arial, sans-serif;
      }

      /* ===== Logo arriba a la izquierda (sin fade, sin sombra) ===== */
      #logo {
        position: absolute;
        top: 2vh;
        left: 2vw;
        width: 22vw;
        height: auto;
        z-index: 5;
        visibility: hidden;
      }
      #logo.visible { visibility: visible; }

      /* ===== Contenedor de las barras ===== */
      /* Se usa !important para ganarle a cualquier regla vieja de styles.css */
      #gourmet .listas {
        position: absolute !important;
        top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
        width: auto !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        display: block !important;
        transform: none !important;
      }

      #gourmet .listaProductos {
        position: absolute !important;
        top: 22.8vh !important;
        left: 7.8vw !important;
        right: auto !important;
        bottom: auto !important;
        width: 84.5vw !important;
        max-width: none !important;
        height: auto !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: stretch !important;
        justify-content: flex-start !important;
        gap: 2.6vh !important;
        margin: 0 !important;
        padding: 0 !important;
        transform: none !important;
      }

      /* ===== Cada barra (sin blur ni sombra; fondo un poco mas opaco) ===== */
      #gourmet .listaProductos .producto {
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        justify-content: space-between !important;
        align-self: stretch !important;
        width: 100% !important;
        height: 9.4vh !important;
        margin: 0 !important;
        padding: 0 2.4vw !important;
        box-sizing: border-box !important;
        border-radius: 999px !important;
        background: linear-gradient(90deg, rgba(25, 25, 25, .85), rgba(55, 55, 55, .75)) !important;
        box-shadow: none !important;
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
        animation: none !important;
        transition: none !important;
        /* styles.css probablemente las deja en opacity:0 esperando a GSAP */
        opacity: 1 !important;
        visibility: visible !important;
        transform: none !important;
      }

      #gourmet .listaProductos .nombreProducto,
      #gourmet .listaProductos .precioProducto {
        color: #fff !important;
        font-weight: 800 !important;
        font-size: 3.3vw !important;
        line-height: 1 !important;
        white-space: nowrap !important;
        text-shadow: none !important;
        background: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        width: auto !important;
        position: static !important;
      }

      #gourmet .listaProductos .nombreProducto { text-transform: uppercase; }
      #gourmet .listaProductos .precioProducto { text-transform: none !important; margin-left: 2vw !important; }
    </style>
  </head>

  <body>
    <main id="gourmet">
      <img id="logo" src="./LogoGalerias-removebg-preview.png" alt="Galería Hipermarket" decoding="async" />

      <section class="listas">
        <div class="listaProductos"></div>
      </section>
    </main>

    <!-- GSAP eliminado: ya no hay animaciones -->

    <script>
    (function () {
      'use strict';

      /* ============ CONFIGURACIÓN ============ */
      var CONFIG = {
        json: './lib/menu.json',
        menuMs: 35000,
        publiMs: 35000,
        publiPorTurno: 4,
        porPantalla: 5,
        avance: 4
      };

      var FONDO_MENU = './otono/MENU.webp';
      var LOGO = './LogoGalerias-removebg-preview.png';

      // Para agregar una foto nueva, añade una línea aquí (imagen en ./publicidad/).
      // null = papas fritas (antes de las 3pm) o perros (después de las 3pm)
      var publicidades = [
        'SANDWICHPOLLO.webp',
        '4ESTACIONES.webp',
        'ROLLTEMPURA.webp',
        'PERROSCLASICO.WEBP',
        'FILADELFIAROLL.webp',
        'perros.webp',
        //'TEQUENOS.WEBP',
        'COMIDA.webp',
        'WAFFLE.webp',

        'PAPASFRITAS.webp',
        null,                       // papas fritas o perros según la hora
        'CALIFORNIAROLL.webp',
        'CASHEA1.webp',
        'EMPANADAS.webp',
      ];

      /* ============ ELEMENTOS Y ESTADO ============ */
      var main = document.getElementById('gourmet');
      var listaEl = document.querySelector('.listaProductos');
      var logo = document.getElementById('logo');

      var contador = 0;
      var cpublicidad = 1;
      var datosMenu = null;
      var firmaPintada = '';

      function esperar(ms) {
        return new Promise(function (r) { setTimeout(r, ms); });
      }

      /* ============ PRECARGA (solo lo que viene después) ============ */
      function precargar(src) {
        return new Promise(function (resolve) {
          var im = new Image();
          im.decoding = 'async';
          im.onload = function () { resolve(true); };
          im.onerror = function () { resolve(false); };
          im.src = src;
        });
      }

      // Cambia el fondo solo cuando la imagen ya está lista.
      async function ponerFondo(src) {
        var ok = await precargar(src);
        if (ok) {
          main.style.backgroundImage = "url('" + src + "')";
        } else {
          console.warn('No se pudo cargar la imagen:', src);
        }
        return ok;
      }

      /* ============ MENÚ ============ */
      async function cargarMenu() {
        try {
          var resp = await fetch(CONFIG.json, { cache: 'no-store' });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          var json = await resp.json();
          if (json && json.data && Array.isArray(json.data.Menu) && json.data.Menu.length) {
            datosMenu = json.data.Menu;
          }
        } catch (err) {
          console.log('Hubo un problema con la petición Fetch: ' + err.message);
        }
        return datosMenu;
      }

      async function mostrarMenu() {
        var menu = await cargarMenu();
        if (!menu) return false;

        if (contador >= menu.length) contador = 0;
        var data = menu.slice(contador, contador + CONFIG.porPantalla);

        var html = '';
        data.forEach(function (p) {
          html += "<div class='producto'><div class='nombreProducto'>" + p.descripcion +
                  "</div><div class='precioProducto'>" + p.precio + "</div></div>";
        });

        // Fondo, logo y productos aparecen juntos, de golpe
        await ponerFondo(FONDO_MENU);
        if (html !== firmaPintada) {
          listaEl.innerHTML = html;
          firmaPintada = html;
        }
        logo.classList.add('visible');

        if (contador >= menu.length - CONFIG.porPantalla) {
          contador = 0;
        } else {
          contador = contador + CONFIG.avance;
        }
        return true;
      }

      /* ============ PUBLICIDAD ============ */
      function srcPublicidad(pos) {
        var img = publicidades[pos - 1];
        if (img === null) {
          img = new Date().getHours() < 15 ? 'PAPASFRITAS.webp' : 'perros.webp';
        }
        return './publicidad/' + img;
      }

      async function mostrarPublicidad() {
        var src = srcPublicidad(cpublicidad);
        cpublicidad = (cpublicidad % publicidades.length) + 1;

        var ok = await ponerFondo(src);
        if (ok) {
          listaEl.innerHTML = '';     // vacía el DOM de la lista mientras se ve la publicidad
          firmaPintada = '';
          logo.classList.remove('visible');
        }
        return ok;
      }

      /* ============ CICLO PRINCIPAL ============ */
      async function ciclo() {
        precargar(FONDO_MENU);
        precargar(LOGO);

        while (true) {
          try {
            // 1) Menú
            var hayMenu = await mostrarMenu();
            if (!hayMenu) {
              await esperar(5000);
              continue;
            }
            precargar(srcPublicidad(cpublicidad));   // deja lista la próxima publicidad
            await esperar(CONFIG.menuMs);

            // 2) Varias publicidades seguidas
            for (var k = 0; k < CONFIG.publiPorTurno; k++) {
              var ok = await mostrarPublicidad();
              // precarga lo siguiente: otra publicidad, o el fondo del menú si es la última
              precargar(k < CONFIG.publiPorTurno - 1 ? srcPublicidad(cpublicidad) : FONDO_MENU);
              if (ok) await esperar(CONFIG.publiMs);
            }
          } catch (err) {
            console.warn('Error en el ciclo:', err);
            await esperar(5000);
          }
        }
      }

      ciclo();
    })();
    </script>

  <!-- Mural sincronizado: TV 1 de 4 -->
  <script src="./mural-sync.js" data-col="0" data-fila="0"></script>
</body>
</html>
