<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Other page</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="styles.css" />
    <script type="text/javascript" src="script.js"></script>
  </head>
  <body >
     
    <main id="gourmet"> 
      <div class="header" >
        <h1 class="titulos" style="color:white">GALERIA HYPERMARKET</h1>
        <div class="titulos"  style="color:white">Pastas</div>
      </div>
     <section class="listas">
      <div class="listaProductos">
        

      </div>


     </section>
      
     
      
    </main>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <script>
    var contador=4;
    var contadorPublicidad=1;
    var cpublicidad=1;
    const timeline = gsap.timeline({
    duration: 1,
    paused: false
});
function loadAnimation() {
  timeline.to(".listaProductos .producto", {
    duration: 3,
    opacity: 1,
    stagger: 0.3
  });
  timeline.play();
}



    const d = new Date();
   var day = d.getDay();
   console.log(day);
    cargarData();
  
 function cargarData(){
 
   fetch('./lib/menu.json').then(function(response) {
     let text="";
     if(response.ok) {
       response.json().then(function(response) {
         
         let data=response.data.Menu.slice(0,5);
          
         for (const productos of data) {
           let text2="<div class='producto'><div class='nombreProducto'>"+productos.descripcion+"</div><div class='precioProducto'>"+productos.precio+"</div></div>"
           text+=text2;
         }
         document.querySelector(".listaProductos").innerHTML=text;
         loadAnimation()
         
       });
     } else {
       console.log('Respuesta de red OK pero respuesta HTTP no OK');
     }
   })
   .catch(function(error) {
     console.log('Hubo un problema con la petición Fetch:' + error.message);
   });
 }

 // ===== LISTA DE PUBLICIDADES =====
 // Para agregar una foto nueva, solo añade una línea aquí
 // (la imagen debe estar en ./publicidad/).
 // null = papas fritas (antes de las 3pm) o perros (después de las 3pm)
 const publicidades = [
  'ROLLTEMPURA.webp',
  'FILADELFIAROLL.webp',
  'COMIDA.webp',
  'CALIFORNIAROLL.webp',
  'ROLLTEMPURA.webp',
  null,                       // papas fritas o perros según la hora
  'FILADELFIAROLL.webp',
  'CALIFORNIAROLL.webp',
  'CASHEA1.webp',
  'ROLLTEMPURA.webp',
  'FILADELFIAROLL.webp',
  'EMPANADAS.webp'
];

 function cargarPublicidad(){
   let img = publicidades[cpublicidad - 1];
   if(img === null){
     img = new Date().getHours() < 15 ? 'PAPASFRITAS.webp' : 'perros.webp';
   }
   document.getElementById("gourmet").style.backgroundImage = "url('./publicidad/" + img + "')";
   // avanza al siguiente; al llegar al final vuelve a 1
   cpublicidad = (cpublicidad % publicidades.length) + 1;
   contadorPublicidad++;
 }
 


 const myInterval= setInterval( function(){
   let text="";
   if(contadorPublicidad%2==0){
    cargarPublicidad();
    document.querySelector(".listaProductos").innerHTML=text;
    }else{
     
      document.getElementById("gourmet").style.backgroundImage  = "url('./otono/MENU.webp')";
      fetch('./lib/menu.json').then(function(response) {
     if(response.ok) {
       response.json().then(function(response) {
        document.querySelector(".listaProductos").innerHTML="";
         let data=response.data.Menu.slice(contador,contador+5);
          
         for (const productos of data) {
           let text2="<div class='producto'><div class='nombreProducto'>"+productos.descripcion+"</div><div class='precioProducto'>"+productos.precio+"</div></div>"
           text+=text2;
         }
         document.querySelector(".listaProductos").innerHTML=text;
         loadAnimation()
         if(contador>=response.data.Menu.length-5){
           contador=0;
           }else{
           contador=contador+4;
           }
       });
       contadorPublicidad++;
     } else {
       console.log('Respuesta de red OK pero respuesta HTTP no OK');
     }
   })
   .catch(function(error) {
     console.log('Hubo un problema con la petición Fetch:' + error.message);
   });
    }
  
 }
   , 35000);
 
 
     </script>
</html>
